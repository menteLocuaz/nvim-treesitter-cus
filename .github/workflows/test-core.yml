on:
  workflow_call:
    inputs:
      type:
        description: "Type of compilation"
        type: string
        default: "build"

  workflow_dispatch:
    inputs:
      type:
        description: "Type of compilation"
        type: choice
        options:
          - build
          - generate
        default: "build"

defaults:
  run:
    shell: bash

jobs:
  check_compilation:
    name: ${{ matrix.nvim_tag }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        nvim_tag: [stable, nightly]

    # Define job-level environment variables for better clarity.
    env:
      NVIM: ${{ runner.os == 'Windows' && 'nvim-win64\bin\nvim.exe' || 'nvim' }}
      NVIM_TAG: ${{ matrix.nvim_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Tree-sitter CLI
        uses: tree-sitter/setup-action/cli@v2

      - name: Install and prepare Neovim
        run: bash ./scripts/ci-install.sh

      # If inputs.type is empty for any reason, default to 'build' as a safe fallback.
      - name: Compile parsers
        if: ${{ inputs.type == 'build' || inputs.type == '' }}
        run: $NVIM -l ./scripts/install-parsers.lua --max-jobs=10

      - name: Generate and compile parsers
        if: ${{ inputs.type == 'generate' }}
        run: $NVIM -l ./scripts/install-parsers.lua --generate --max-jobs=10

      - name: Check parsers
        run: $NVIM -l ./scripts/check-parsers.lua

      # Use runner.os instead of matrix.os for platform-specific conditions.
      - name: Check queries (nvim)
        if: ${{ runner.os == 'Windows' }}
        run: $NVIM -l ./scripts/check-queries.lua

      - name: Check queries (tsqueryls)
        if: ${{ runner.os != 'Windows' }}
        run: make checkquery

      - name: Run highlight tests
        if: ${{ runner.os != 'Windows' }}
        run: make tests TESTS=query NVIM_BIN=$NVIM

      - name: Run indents tests
        if: ${{ runner.os != 'Windows' }}
        run: make tests TESTS=indent NVIM_BIN=$NVIM
